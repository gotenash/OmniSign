                                        <div style="font-size:${textSize}; font-weight: bold; margin: 22px 0; color:${textColor};">${firstM.title || 'Réunion'}</div>
                                        <div style="font-size:${subTextSize}; opacity: 0.8; margin-bottom: 43px; color:${textColor};">⏱️ ${startDisplay} - ${endDisplay}</div>
                                        <div class="tpl-meeting-status" style="background:${bgBadge}; color:white; padding: 22px 96px; font-size: ${subTextSize}; border-radius: 30px; display: inline-block;">${status.toUpperCase()}</div>`;
                                }
                            }
                        }
                    };
                    
                    if (isLive) {
                        tpl.innerHTML = `<div style="font-size:154px; font-weight:bold; margin-bottom:10px;">${roomName}</div><div id="meeting-loader" style="font-size: 38px;">Chargement des réunions...</div>`;
                        fetch(`${targetServerUrl}/api/player/meetings/today?deviceId=${encodeURIComponent(dId)}&siteId=${encodeURIComponent(sId)}`)
                            .then(r => r.json())
                            .then(data => {
                                const loader = tpl.querySelector('#meeting-loader');
                                if (loader) loader.remove();
                                renderMeetings(data);
                            })
                            .catch(async () => {
                                try {
                                    const rLocal = await fetch('meetings.json?nocache=' + Date.now());
                                    if (rLocal.ok) {
                                        const localData = await rLocal.json();
                                        if (localData && localData.meetings) return renderMeetings(localData);
                                    }
                                } catch(e) {}
                                try {
                                    const cachedStr = localStorage.getItem('cached_meetings_data');
                                    if (cachedStr) return renderMeetings(JSON.parse(cachedStr));
                                } catch(e) {}
                                renderMeetings({ rooms: [], meetings: [] });
                            });
                    } else {
                        const statusClass = (page.data.status || 'disponible').toLowerCase();
                        const status = page.data.status || 'Disponible';
                        const subject = page.data.subject || 'Objet non renseigné';

                        if (customTpl && customTpl.customHtml) {
                            let html = customTpl.customHtml;
                            html = html.replace(/{{room}}/g, roomName)
                                       .replace(/{{subject}}/g, subject)
                                       .replace(/{{status}}/g, status)
                                       .replace(/{{startTime}}/g, '')
                                       .replace(/{{endTime}}/g, '');
                            tpl.innerHTML = html;
                        } else {
                            const titleColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#ffffff';
                            const titleSize = (customTpl && customTpl.titleFontSize) ? `${parseInt(customTpl.titleFontSize)}px` : '154px';
                            const textColor = (customTpl && customTpl.textColor) ? customTpl.textColor : '#bdc3c7';
                            const textSize = (customTpl && customTpl.textFontSize) ? `${parseInt(customTpl.textFontSize)}px` : '58px';
                            const badgeAvailable = (customTpl && customTpl.badgeBgAvailable) ? customTpl.badgeBgAvailable : '#3498db';
                            const badgeBusy = (customTpl && customTpl.badgeBgBusy) ? customTpl.badgeBgBusy : '#e74c3c';
                            const bgBadge = (status === 'Disponible' || statusClass === 'disponible') ? badgeAvailable : badgeBusy;

                            tpl.innerHTML = `
                                <div class="tpl-meeting-room" style="color:${titleColor}; font-size:${titleSize};">${roomName}</div>
                                <div style="color:${textColor}; font-size:${textSize}; margin: 43px 0;">${subject}</div>
                                <div class="tpl-meeting-status" style="background:${bgBadge}; color:white; padding: 22px 96px; font-size: 38px; border-radius: 30px; display: inline-block;">${status.toUpperCase()}</div>`;
                        }
                    }
                }
                else if (page.template === 'video_fullscreen') {
                    const videoUrl = page.data.localVideoUrl || page.data.videoUrl;
                    let finalUrl = videoUrl;
                    if (videoUrl && videoUrl.startsWith('/media') && !page.data.localVideoUrl) {
                        finalUrl = `${targetServerUrl}${videoUrl}${playlistData.apiKey ? '?apiKey=' + playlistData.apiKey : ''}`;
                    }
                    tpl.style.padding = '0';
                    const isMuted = page.data.muted === true;
                    const fitMode = page.data.fitMode || 'cover';
                    tpl.innerHTML = `
                        <video src="${finalUrl}" autoplay playsinline muted ${page.data.loop ? 'loop' : ''} 
                               style="width:100%; height:100%; object-fit:${fitMode}; pointer-events:none;"></video>
                        ${page.data.legend ? `
                            <div style="position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.7); 
                                        color:${page.data.legendColor || 'white'}; 
                                        font-family:${page.data.legendFontFamily || 'sans-serif'};
                                        padding:2vh; font-size:${(page.data.legendFontSize || 40) / 10}vw; 
                                        text-align:center; z-index:10;">${page.data.legend}</div>` : ''}
                    `;
                } else if (page.template === 'weather') {
                    const city = page.data.city || 'Paris';
                    const lat = page.data.lat || '48.8566';
                    const lon = page.data.lon || '2.3522';
                    tpl.innerHTML = `<div class="tpl-header">MÉTÉO - ${city.toUpperCase()}</div><div id="weather-loader" style="font-size: 38px;">Chargement des prévisions...</div>`;
                    
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=weathercode,temperature_2m&timezone=auto`)
                        .then(r => r.json())
                        .then(data => {
                            const loader = tpl.querySelector('#weather-loader');
                            if (loader) loader.remove();
                            
                            const periods = [
                                { label: 'MATIN', timeLabel: '9h', index: 9 },
                                { label: 'MIDI', timeLabel: '12h', index: 12 },
                                { label: 'APRÈS-MIDI', timeLabel: '16h', index: 16 }
                            ];
                            
                            const grid = document.createElement('div');
                            grid.style.cssText = "display:flex; gap:38px; justify-content:center; width:90%;";
                            
                            periods.forEach(p => {
                                const icon = getWeatherIcon(data.hourly.weathercode[p.index]);
                                const temp = Math.round(data.hourly.temperature_2m[p.index]);
                                grid.innerHTML += `
                                    <div style="background:rgba(255,255,255,0.1); padding:22px; border-radius:20px; flex:1; text-align:center;">
                                        <div style="font-size:29px; color:#3498db; font-weight:bold; margin-bottom:5px;">${p.label}</div>
                                        <div style="font-size:23px; opacity:0.6; margin-bottom:11px;">${p.timeLabel}</div>
                                        <div style="font-size:77px; margin:11px 0;">${icon}</div>
                                        <div style="font-size:42px; font-weight:bold;">${temp}°</div>
                                    </div>`;
                            });
                            tpl.appendChild(grid);
                        }).catch(() => { tpl.innerHTML = '<div class="tpl-header">Météo indisponible</div>'; });
                }

                pageZonesContainer.appendChild(tpl);

                if (page.template === 'video_fullscreen') {
                    const v = tpl.querySelector('video');
                    const isMuted = page.data.muted === true;
                    // Démarre toujours en muet (contourne la politique autoplay du navigateur)
                    v.muted = true;
                    v.play().then(() => {
                        if (!isMuted) v.muted = false;
                    }).catch(e => {
                        console.warn("Autoplay vidéo échoué:", e);
                    });
                }
            }

            // Rendre les zones pour la page actuelle
            if (page.zones && page.zones.length > 0) {
                page.zones.forEach(zone => {
                    const zoneElement = document.createElement('div');
                    zoneElement.className = 'zone';
                    zoneElement.style.left = zone.x + '%';
                    zoneElement.style.top = zone.y + '%';
                    zoneElement.style.width = zone.w + '%';
                    zoneElement.style.height = zone.h + '%';

                    // Appliquer l'animation d'entrée
                    if (zone.animationIn && zone.animationIn !== 'none') {
                        zoneElement.classList.add(`anim-${zone.animationIn}`);
                        zoneElement.style.animationDuration = (zone.animationInDuration || 1000) + 'ms';
                    }

                    // Appliquer un fond spécifique à la zone si disponible
                    const zoneBg = zone.localBackgroundUrl || zone.backgroundUrl;
                    const authQuery = (previewId && apiKey) ? `?apiKey=${apiKey}` : '';

                    if (zoneBg) {
                        const finalBg = zoneBg.startsWith('/media') ? `${zoneBg}${authQuery}` : zoneBg;
                        zoneElement.style.backgroundImage = `url(${finalBg})`;
                        zoneElement.style.backgroundSize = 'cover';
                        zoneElement.style.backgroundPosition = 'center';
                    }

                    // On utilise le chemin local si disponible, sinon le chemin distant avec l'URL du serveur
                    let mediaUrl = zone.localUrl || zone.url || "";
                    const token = apiKey || (playlistData && playlistData.apiKey);
                    const targetServerUrl = playlistData.serverUrl || serverUrl;
                    if (mediaUrl.startsWith('/') && !mediaUrl.startsWith('./')) {
                        mediaUrl = `${targetServerUrl}${mediaUrl}${token ? (mediaUrl.includes('?') ? '&' : '?') + 'apiKey=' + token : ''}`;
                    }

                    if ((zone.type === 'image' || zone.type === 'sozi') && mediaUrl.toLowerCase().split('?')[0].endsWith('.svg')) {
                        // C'est un SVG. Vérifier s'il a des métadonnées Sozi d'accompagnement
                        const metaUrl = mediaUrl.split('?')[0] + '.json';
                        fetch(metaUrl)
                            .then(async (metaRes) => {
                                if (!metaRes.ok) throw new Error("Pas de métadonnées");
                                const meta = await metaRes.json();
                                if (meta.type !== 'sozi' || !meta.frames || meta.frames.length === 0) {
                                    throw new Error("Format Sozi invalide");
                                }
                                
                                // Charger le SVG de manière inline
                                const svgRes = await fetch(mediaUrl);
                                if (!svgRes.ok) throw new Error("Échec chargement SVG");
                                const svgText = await svgRes.text();
                                
                                zoneElement.innerHTML = '';
                                
                                const wrapper = document.createElement('div');
                                wrapper.style.width = '100%';
                                wrapper.style.height = '100%';
                                wrapper.style.position = 'relative';
                                wrapper.style.overflow = 'hidden';
                                
                                const svgWrapper = document.createElement('div');
                                svgWrapper.style.position = 'absolute';
                                svgWrapper.style.transformOrigin = '0 0';
                                svgWrapper.innerHTML = svgText;
                                
                                const svgEl = svgWrapper.querySelector('svg');
                                if (svgEl) {
                                    if (!svgEl.getAttribute('viewBox')) {
                                        const w = svgEl.getAttribute('width') || 800;
                                        const h = svgEl.getAttribute('height') || 600;
                                        svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
                                    }
                                    svgEl.style.width = '1000px';
                                    svgEl.style.height = 'auto';
                                }
                                
                                wrapper.appendChild(svgWrapper);
                                zoneElement.appendChild(wrapper);
                                
                                let currentFrameIdx = 0;
                                let animTimeout = null;
                                
                                function playSoziStep() {
                                    if (!document.body.contains(svgWrapper)) {
                                        // Si l'élément a été démonté de la page, arrêter l'animation
                                        clearTimeout(animTimeout);
                                        return;
                                    }
                                    const frame = meta.frames[currentFrameIdx];
                                    
                                    const centerX = zoneElement.clientWidth / 2;
                                    const centerY = zoneElement.clientHeight / 2;
                                    
                                    svgWrapper.style.transition = `transform ${frame.duration}s ${frame.easing}`;
                                    svgWrapper.style.left = `${centerX}px`;
                                    svgWrapper.style.top = `${centerY}px`;
                                    svgWrapper.style.transform = `translate(${frame.x}px, ${frame.y}px) scale(${frame.zoom}) rotate(${frame.rotate}deg)`;
                                    
                                    animTimeout = setTimeout(() => {
                                        currentFrameIdx = (currentFrameIdx + 1) % meta.frames.length;
                                        playSoziStep();
                                    }, (frame.duration + frame.delay) * 1000);
                                }
                                
                                // Démarrer l'animation après un petit délai
                                setTimeout(playSoziStep, 100);
                                
                            })
                            .catch((err) => {
                                // Fallback image standard si pas de métadonnées ou erreur
                                zoneElement.innerHTML = `<img src="${mediaUrl}">`;
                            });
                    } else if (zone.type === 'image' || zone.type === 'sozi') {
                        zoneElement.innerHTML = `<img src="${mediaUrl}">`;
                    } else if (zone.type === 'video') {
                        const videoElement = document.createElement('video');
                        videoElement.src = mediaUrl;
                        videoElement.autoplay = true;
                        videoElement.muted = true; // Démarre muet pour contourner la politique autoplay
                        videoElement.loop = true;
                        videoElement.playsInline = true;
                        videoElement.dataset.muted = zone.muted ? 'true' : 'false';
                        zoneElement.appendChild(videoElement);
                        // Dé-muter après lancement si le son est souhaité
                        videoElement.play().then(() => {
                            if (!zone.muted) {
                                videoElement.muted = false;
                                const currentVolume = playlistData.volume !== undefined ? playlistData.volume : 100;
                                videoElement.volume = currentVolume / 100;
                            }
                        }).catch(() => { /* reste muet si lecture impossible */ });
                    } else if (zone.type === 'web' || zone.type === 'sozi_zip') {
                        const zoom = zone.webZoom || 1.0;
                        const panX = zone.webPanX || 0;
                        const panY = zone.webPanY || 0;
                        const iframeUrl = zone.url.startsWith('/') ? mediaUrl : zone.url;
                        
                        const ratio = (playlistData.resolution || '16/9').split('/');
                        const wRatio = parseInt(ratio[0]) || 16;
                        const hRatio = parseInt(ratio[1]) || 9;
                        let virtualW = 1920;
                        let virtualH = 1080;
                        if (wRatio === 9 && hRatio === 16) {
                            virtualW = 1080;
                            virtualH = 1920;
                        } else if (wRatio === 4 && hRatio === 3) {
                            virtualW = 1024;
                            virtualH = 768;
                        } else if (wRatio < hRatio) {
                            virtualW = 1080;
                            virtualH = Math.round(1080 * (hRatio / wRatio));
                        } else {
                            virtualW = 1920;
                            virtualH = Math.round(1920 * (hRatio / wRatio));
                        }

                        const screenElement = document.getElementById('player-screen') || document.body;
                        const screenW = parseFloat(screenElement.style.width) || screenElement.offsetWidth || window.innerWidth;
                        const scaleRatio = screenW / virtualW;
                        
                        const zoneVirtualW = virtualW * (zone.w / 100);
                        const zoneVirtualH = virtualH * (zone.h / 100);
                        const iframeWidth = zoneVirtualW / zoom;
                        const iframeHeight = zoneVirtualH / zoom;
                        const iframeScale = zoom * scaleRatio;

                        zoneElement.innerHTML = `<div style="width:100%;height:100%;overflow:hidden;position:relative;">
                            <iframe src="${iframeUrl}" onload="try { this.contentDocument.head.insertAdjacentHTML('beforeend', '<style>*{cursor:none !important;}</style>'); } catch(e) {}" style="width:${iframeWidth}px;height:${iframeHeight}px;border:none;position:absolute;top:0;left:0;transform:scale(${iframeScale}) translate(${panX}%,${panY}%);transform-origin:0 0;"></iframe>
                        </div>`;
                    } else if (zone.type === 'qrcode') {
                        const qrText = zone.text || 'https://omnisign.com';
                        const targetServerUrl = playlistData.serverUrl || serverUrl;
                        const remoteQrUrl = `${targetServerUrl}/api/admin/qrcode?text=${encodeURIComponent(qrText)}${token ? '&apiKey=' + token : ''}`;
                        const qrUrl = zone.localUrl ? mediaUrl : remoteQrUrl;
                        zoneElement.innerHTML = `<img src="${qrUrl}" onerror="if(!this.dataset.fallback){this.dataset.fallback=true;this.src='${remoteQrUrl}';}" style="width:100%;height:100%;object-fit:contain;">`;
                    } else if (zone.type === 'text' || zone.type === 'paragraph') {
                        // Calcul du ratio d'échelle pour adapter la taille de texte de manière réactive
                        const ratio = (playlistData.resolution || '16/9').split('/');
                        const wRatio = parseInt(ratio[0]) || 16;
                        const hRatio = parseInt(ratio[1]) || 9;
                        let virtualW = 1920;
                        if (wRatio === 9 && hRatio === 16) {
                            virtualW = 1080;
                        } else if (wRatio === 4 && hRatio === 3) {
                            virtualW = 1024;
                        } else if (wRatio < hRatio) {
                            virtualW = 1080;
                        } else {
                            virtualW = 1920;
                        }
                        const playerWidth = window.innerWidth;
                        const scaleRatio = playerWidth / virtualW;
                        const scaledFontSize = (zone.fontSize || 24) * scaleRatio;

                        const content = zone.isMarquee ? 
                            `<div class="marquee-container"><div class="marquee-content text-content">${zone.text || ''}</div></div>` :
                            `<div class="text-content" style="width:100%; height:100%; overflow:hidden;">${zone.text || ''}</div>`;
                        zoneElement.innerHTML = content;
                        
                        const textContentDiv = zoneElement.querySelector('.text-content');
 
                        if (zone.fontFamily && (zone.localFontUrl || zone.fontUrl)) {
                            const fontUrl = zone.localFontUrl || zone.fontUrl;
                            const fontAuth = (previewId && apiKey) ? `&apiKey=${apiKey}` : '';
                            const finalFontUrl = fontUrl.startsWith('/media') ? `${fontUrl}${fontAuth}` : fontUrl;
                            
                            const styleId = `font-${zone.fontFamily.replace(/\s+/g, '-')}`;
                            if (!document.getElementById(styleId)) {
                                const style = document.createElement('style');
                                style.id = styleId;
                                style.textContent = `@font-face { font-family: "${zone.fontFamily}"; src: url("${finalFontUrl}"); }`;
                                document.head.appendChild(style);
                            }
                        }
 
                        textContentDiv.style.fontFamily = zone.fontFamily || 'sans-serif';
                        textContentDiv.style.fontSize = scaledFontSize + 'px';
                        textContentDiv.style.color = zone.color || 'white';
                        textContentDiv.style.textAlign = zone.textAlign || (zone.type === 'paragraph' ? 'left' : 'center');
                        if (zone.type === 'paragraph') {
                            textContentDiv.style.display = 'block';
                        }
                        // Ajuster la justification pour le flexbox
                        textContentDiv.style.justifyContent = zone.textAlign === 'justify' ? 'flex-start' : zone.textAlign;
                    } else if (zone.type === 'clock') {
                        // Calcul du ratio d'échelle pour le texte de l'horloge
                        const ratio = (playlistData.resolution || '16/9').split('/');
                        const wRatio = parseInt(ratio[0]) || 16;
                        const hRatio = parseInt(ratio[1]) || 9;
                        let virtualW = 1920;
                        if (wRatio === 9 && hRatio === 16) {
                            virtualW = 1080;
                        } else if (wRatio === 4 && hRatio === 3) {
                            virtualW = 1024;
                        } else if (wRatio < hRatio) {
                            virtualW = 1080;
                        } else {
                            virtualW = 1920;
                        }
                        const playerWidth = window.innerWidth;
                        const scaleRatio = playerWidth / virtualW;
                        const scaledFontSize = (zone.fontSize || 24) * scaleRatio;

                        zoneElement.innerHTML = `<div class="clock-content"></div>`;
                        const clockContent = zoneElement.querySelector('.clock-content');

                        // Appliquer la police personnalisée si définie
                        if (zone.fontFamily && (zone.localFontUrl || zone.fontUrl)) {
                            const fontUrl = zone.localFontUrl || zone.fontUrl;
                            const fontAuth = (previewId && apiKey) ? `&apiKey=${apiKey}` : '';
                            const finalFontUrl = fontUrl.startsWith('/media') ? `${fontUrl}${fontAuth}` : fontUrl;
                            
                            const styleId = `font-${zone.fontFamily.replace(/\s+/g, '-')}`;
                            if (!document.getElementById(styleId)) {
                                const style = document.createElement('style');
                                style.id = styleId;
                                style.textContent = `@font-face { font-family: "${zone.fontFamily}"; src: url("${finalFontUrl}"); }`;
                                document.head.appendChild(style);
                            }
                        }

                        clockContent.style.fontFamily = zone.fontFamily || 'sans-serif';
                        clockContent.style.fontSize = scaledFontSize + 'px';
                        clockContent.style.color = zone.color || 'white';
                        
                        const updateTime = () => {
                            clockContent.innerText = formatClock(new Date(), zone.clockFormat || 'HH:mm:ss');
                        };
                        updateTime();
                        activeClockIntervals.push(setInterval(updateTime, 1000));
                    }
                    // Gestion du timing d'apparition (start) et de disparition (duration)
                    const startMs = zone.start || 0;
                    const durationMs = zone.duration || page.duration || 5000;
                    const endMs = startMs + durationMs;

                    if (startMs > 0) {
                        zoneElement.style.display = 'none';
                        setTimeout(() => {
                            zoneElement.style.display = 'block';
                            const videoElement = zoneElement.querySelector('video');
                            if (videoElement) {
                                videoElement.play().then(() => {
                                    if (!zone.muted) videoElement.muted = false;
                                }).catch(() => {});
                            }
                        }, startMs);
                    }

                    // Programmer l'animation de sortie
                    const isPermanent = playlistData.items.length === 1 && !playlistData.sequenceContext && endMs >= (page.duration || 5000);
                    
                    if (!isPermanent && zone.animationOut && zone.animationOut !== 'none') {
                        const outDuration = zone.animationOutDuration || 800;
                        setTimeout(() => {
                            zoneElement.classList.add(`anim-${zone.animationOut}`);
                            zoneElement.style.animationDuration = outDuration + 'ms';
                        }, Math.max(0, endMs - outDuration));
                    }

                    if (!isPermanent) {
                        setTimeout(() => {
                            zoneElement.style.display = 'none';
                        }, endMs);
                    }

                    pageZonesContainer.appendChild(zoneElement);
                });
            }

            // Logique de progression (Timeout ou Fin de vidéo)
            const moveToNext = () => {
                if (currentIndex === playlistData.items.length - 1 && playlistData.sequenceContext && socket) {
                    socket.emit('request-next-playlist-in-sequence');
                } else {
                    currentIndex = (currentIndex + 1) % playlistData.items.length;
                    playNext();
                }
            };

            if (playlistData.items.length > 1 || (playlistData.sequenceContext && socket)) {
                const videoTpl = pageZonesContainer.querySelector('video');
                if (page.template === 'video_fullscreen' && videoTpl && !page.data.loop) {
                    log(`Attente de la fin de la vidéo pour transition.`);
                    videoTpl.onended = moveToNext;
                    videoTpl.onerror = () => {
                        log("Erreur de chargement de la vidéo full-screen", true);
                        moveToNext();
                    };
                } else {
                    playTimeout = setTimeout(moveToNext, page.duration);
                    log(`Page suivante dans ${page.duration / 1000}s.`);
                }
            } else {
                log(`Playlist d'une seule page : affichage permanent sans rechargement.`);
            }
        }

        function getAlertIcon(type) {
            if (type === 'danger') return '🚨';
            if (type === 'warning') return '⚠️';
            return 'ℹ️';
        }

         function updateAlertOffset() {
            const overlay = document.getElementById('alert-overlay');
            const pageZones = document.getElementById('current-page-zones');
            if (!pageZones) return;

            let totalHeight = 0;
            if (overlay && overlay.children.length > 0) {
                Array.from(overlay.children).forEach(child => {
                    totalHeight += child.offsetHeight || 0;
                });
                if (totalHeight === 0) {
                    totalHeight = overlay.children.length * (window.innerWidth * 0.025 + 30);
                }
                pageZones.style.transform = `translate3d(0, ${totalHeight}px, 0)`;
                pageZones.style.height = `calc(100% - ${totalHeight}px)`;
            } else {
                pageZones.style.transform = 'translate3d(0, 0, 0)';
                pageZones.style.height = '100%';
            }

            // Réajuster dynamiquement l'échelle du template actif pour éviter le débordement
            const activeTpl = pageZones.querySelector('.tpl-container');
            if (activeTpl && !activeTpl.querySelector('video')) {
                const playerScreen = document.getElementById('player-screen');
                const playerWidth = playerScreen.clientWidth || window.innerWidth;
                const playerHeight = playerScreen.clientHeight || window.innerHeight;
                
                const designWidth = parseInt(activeTpl.style.width) || 1920;
                const designHeight = parseInt(activeTpl.style.height) || 1080;
                
                const availableHeight = playerHeight - totalHeight;
                const scaleX = playerWidth / designWidth;
                const scaleY = availableHeight / designHeight;
                const scaleRatio = Math.min(scaleX, scaleY);
                
                activeTpl.style.transform = `scale(${scaleRatio})`;
                const scaledWidth = designWidth * scaleRatio;
                activeTpl.style.left = ((playerWidth - scaledWidth) / 2) + 'px';
            }
        }

        const alertTimers = {};

        function displayAlert(alert) {
            const overlay = document.getElementById('alert-overlay');
            if (document.getElementById(`alert-${alert.id}`)) return;

            const div = document.createElement('div');
            div.id = `alert-${alert.id}`;
            div.className = `flash-message flash-${alert.type}`;
            
            div.innerHTML = `
                <span style="flex-shrink: 0; font-size: 2.5vw;">${getAlertIcon(alert.type)}</span>
                <div class="marquee-wrapper" style="flex: 1; overflow: hidden; white-space: nowrap; position: relative; height: 100%; display: flex; align-items: center;">
                    <div id="marquee-text-${alert.id}" style="display: inline-block; white-space: nowrap; font-size: 2.5vw; font-weight: bold; position: relative; will-change: transform;">${alert.text}</div>
                </div>
            `;
            overlay.appendChild(div);
            updateAlertOffset();
            setTimeout(updateAlertOffset, 50);

            const textEl = document.getElementById(`marquee-text-${alert.id}`);
            const wrapperEl = textEl.parentElement;

            let offset = wrapperEl.offsetWidth || window.innerWidth;
            const speed = 2.5; // Vitesse de défilement (pixels par trame à 60 FPS)

            function step() {
                if (!document.getElementById(`alert-${alert.id}`)) return;
                offset -= speed;
                const textWidth = textEl.offsetWidth || 300;
                const containerWidth = wrapperEl.offsetWidth || window.innerWidth;

                if (offset < -textWidth) {
                    offset = containerWidth;
                }
                textEl.style.transform = `translate3d(${offset}px, 0, 0)`;
                alertTimers[alert.id] = requestAnimationFrame(step);
            }

            requestAnimationFrame(() => {
                offset = wrapperEl.offsetWidth || window.innerWidth;
                step();
            });
        }

        function removeAlert(alertId) {
            if (alertTimers[alertId]) {
                cancelAnimationFrame(alertTimers[alertId]);
                delete alertTimers[alertId];
            }
            const el = document.getElementById(`alert-${alertId}`);
            if (el) {
                el.remove();
                updateAlertOffset();
            }
        }

        function renderAlertsFromManifest(alerts) {
            const overlay = document.getElementById('alert-overlay');
            const currentAlertIds = alerts.map(a => `alert-${a.id}`);
            
            Array.from(overlay.children).forEach(child => {
                if (!currentAlertIds.includes(child.id)) {
                    const rawId = child.id.replace('alert-', '');
                    removeAlert(rawId);
                }
            });

            alerts.forEach(displayAlert);
            updateAlertOffset();
        }

        function setupSocketListeners() {
            if (!socket) return;
            socket.on('show-alert', (alert) => displayAlert(alert));
            socket.on('clear-alert', (id) => removeAlert(id));
            // Ajout de l'écoute des mises à jour de playlist pour une transition immédiate
            socket.on('playlist-updated', (data) => {
                log("Mise à jour immédiate reçue via Socket.");
                refreshPlaylist();
            });
            socket.on('volume-change', (data) => {
                log(`Volume mis à jour via Socket : ${data.volume}%`);
                playlistData.volume = data.volume;
                document.querySelectorAll('video').forEach(v => {
                    if (v.dataset.muted !== 'true') {
                        v.volume = data.volume / 100;
                    }
                });
            });
        }

        function formatClock(date, format) {
            const h24 = date.getHours();
            const h12 = h24 % 12 || 12;
            const hours24 = String(h24).padStart(2, '0');
            const hours12 = String(h12).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0'); // Month is 0-indexed
            const year = date.getFullYear();
            const yearShort = String(year).slice(-2);

            return format
                .replace(/HH/g, hours24)
                .replace(/hh/g, hours12)
                .replace(/mm/g, minutes)
                .replace(/ss/g, seconds)
                .replace(/DD/g, day)
                .replace(/jj/g, day)
                .replace(/MM/g, month)
                .replace(/YYYY/g, year)
                .replace(/aaaa/g, year)
                .replace(/aa/g, yearShort);
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code <= 3) return '☁️';
            if (code <= 48) return '🌫️';
            if (code <= 55) return '🌦️';
            if (code <= 65) return '🌧️';
            if (code <= 77) return '❄️';
            if (code <= 82) return '🌦️';
            if (code <= 99) return '⛈️';
            return '❓';
        }

        // Démarrage de la détection socket
        loadSocketIO(serverUrl);

        // On vérifie les mises à jour du fichier JSON toutes les 30s
        // setInterval(refreshPlaylist, 30000);
        refreshPlaylist();
    </script>
</body>
</html>
