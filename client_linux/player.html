<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Reset de base */
        body, html { margin: 0; padding: 0; background: black; overflow: hidden; height: 100vh; width: 100vw; cursor: none !important; }
        
        /* On cache le curseur sur TOUS les éléments sans casser leur taille */
        * { cursor: none !important; }

        #player-screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black; /* Fallback background */
        }
        #current-page-zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #player-screen .bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            will-change: transform;
            transform: translate3d(0,0,0);
        }
        #player-screen .zone {
            position: absolute;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            will-change: transform;
            transform: translate3d(0,0,0);
        }
        #player-screen .zone img,
        #player-screen .zone video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garde l'aspect ratio, s'adapte à la zone */
            will-change: transform; /* Force le GPU à gérer les transformations */
            transform: translate3d(0,0,0); /* Crée un contexte de rendu 3D isolé */
            backface-visibility: hidden; /* Empêche les artefacts 3D indésirables */
        }
        #player-screen .zone iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #player-screen .zone .clock-content {
            width: 100%;
            height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        #player-screen .zone .text-content {
            color: white;
            font-family: sans-serif;
            font-size: 3vw; /* Taille de police responsive */
            text-align: center;
            padding: 1%;
            word-wrap: break-word;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center; /* Centrage vertical par défaut */
            justify-content: center; /* Centrage horizontal par défaut */
        }

        /* Animations d'entrée */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideTop { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideBottom { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideLeft { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .anim-fade-in { animation: fadeIn 1s ease-out forwards; }
        .anim-slide-top { animation: slideTop 0.8s ease-out forwards; }
        .anim-slide-bottom { animation: slideBottom 0.8s ease-out forwards; }
        .anim-slide-left { animation: slideLeft 0.8s ease-out forwards; }
        .anim-slide-right { animation: slideRight 0.8s ease-out forwards; }
        .anim-zoom-in { animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Animations de sortie */
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes zoomOut { from { transform: scale(1); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
        .anim-fade-out { animation: fadeOut 0.8s ease-in forwards; }
        .anim-zoom-out { animation: zoomOut 0.8s ease-in forwards; }

        /* Texte défilant */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            flex: 1;
            display: block;
            position: relative;
            width: 100%;
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: omniMarquee 15s linear infinite;
            will-change: transform;
        }
        @keyframes omniMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Styles des Alertes Flash */
        #alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 10001; /* Au-dessus de tout le reste */
            pointer-events: none;
        }
        .flash-message {
            padding: 15px 25px;
            color: white;
            font-family: sans-serif;
            font-size: 2.5vw;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            animation: slideDown 0.5s ease-out;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .flash-info { background: rgba(52, 152, 219, 0.9); }
        .flash-warning { background: rgba(243, 156, 18, 0.9); }
        .flash-danger { background: rgba(231, 76, 60, 0.9); }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        /* Templates Styles */
        .tpl-container { 
            width: 100%; height: 100%; color: white; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 80px 80px 80px; font-family: sans-serif; z-index: 5; 
            box-sizing: border-box;
            will-change: transform;
            transform: translate3d(0,0,0);
        }
        .tpl-container video {
            will-change: transform;
            transform: translate3d(0,0,0);
            backface-visibility: hidden;
        }
        .tpl-header { font-size: 96px; margin-bottom: 43px; border-bottom: 3px solid #3498db; padding-bottom: 10px; font-weight: bold; }
        .tpl-content { display: flex; flex-direction: column; gap: 22px; width: 80%; }
        .tpl-row { background: rgba(255,255,255,0.1); padding: 22px; border-radius: 15px; display: flex; align-items: center; }
        .tpl-label { color: #3498db; font-size: 38px; width: 30%; text-align: left; font-weight: bold; }
        .tpl-value { font-size: 58px; width: 70%; text-align: right; }
        
        .tpl-meeting-room { font-size: 154px; font-weight: bold; margin-bottom: 22px; }
        .tpl-meeting-status { font-size: 38px; padding: 22px 96px; border-radius: 100px; margin-top: 43px; }
        .status-disponible { background: #27ae60; }
        .status-occupée { background: #e74c3c; }

        /* Style pour les infos de debug à l'écran */
        #debug-log {
            position: absolute; bottom: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); color: #2ecc71; 
            font-family: monospace; font-size: 10px; padding: 5px; 
            z-index: 10000; pointer-events: none; max-width: 80%;
        }

        /* Styles pour l'écran de serveur indisponible */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        #offline-screen {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
        }
        #offline-screen .bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .offline-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .offline-box {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(231, 76, 60, 0.3);
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.5s ease-out;
            font-family: sans-serif;
        }
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        .offline-title {
            font-size: 32px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .offline-text {
            font-size: 20px;
            color: #ecf0f1;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Styles pour l'affichage en petit en bas (mini-error) */
        #offline-screen.mini-error {
            pointer-events: none;
            z-index: 10000;
        }
        #offline-screen.mini-error .bg-layer {
            display: none !important;
        }
        #offline-screen.mini-error .offline-container {
            background: transparent !important;
            top: auto;
            bottom: 20px;
            height: auto;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
        }
        #offline-screen.mini-error .offline-box {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(231, 76, 60, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            animation: fadeIn 0.3s ease-out;
            pointer-events: auto;
            text-align: left;
        }
        #offline-screen.mini-error .offline-icon {
            font-size: 28px;
            margin-bottom: 0;
            animation: pulse 1.5s infinite ease-in-out;
        }
        #offline-screen.mini-error .offline-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        #offline-screen.mini-error .offline-title {
            font-size: 16px;
            margin-bottom: 2px;
            font-weight: 700;
        }
        #offline-screen.mini-error .offline-text {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="alert-overlay"></div>
    <div id="player-screen">
        <!-- Ecran d'erreur hors-ligne -->
        <div id="offline-screen">
            <img class="bg-layer" src="img/splashscreen.png">
            <div class="offline-container">
                <div class="offline-box">
                    <div class="offline-icon">🔌</div>
                    <div class="offline-details">
                        <div class="offline-title">Serveur indisponible</div>
                        <div class="offline-text">Veuillez contacter l'administrateur</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="loader" style="color: white; font-family: sans-serif; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
            Connexion au serveur...<br>
            <small id="status-extra" style="color: #bdc3c7; font-size: 0.8em;"></small>
        </div>
        <img id="splash-screen" class="bg-layer" src="" style="display:none; z-index: 10;">
        <img id="global-background" class="bg-layer" src="" style="display:none;">
        <div id="current-page-zones">
            <!-- Les zones seront chargées dynamiquement ici -->
        </div>
        <div id="debug-log">Initialisation...</div>
    </div>

    <script>
        let isServerOnline = true;
        let offlineTimer = null;
        let offlineCycleInterval = null;
        let offlineCycleTimeout = null;

        function showOfflineOverlay(isMini = false) {
            if (playlistData && (playlistData.showOfflineAlert === false || playlistData.showOfflineAlert === 'false')) {
                return;
            }
            const offlineEl = document.getElementById('offline-screen');
            if (offlineEl) {
                if (isMini) {
                    offlineEl.classList.add('mini-error');
                } else {
                    offlineEl.classList.remove('mini-error');
                }
                offlineEl.style.display = 'block';
            }
            const loaderEl = document.getElementById('loader');
            if (loaderEl) loaderEl.style.display = 'none';
        }

        function hideOfflineOverlay() {
            const offlineEl = document.getElementById('offline-screen');
            if (offlineEl) {
                offlineEl.style.display = 'none';
                offlineEl.classList.remove('mini-error');
            }
        }

        function showOfflineError() {
            if (isServerOnline) {
                isServerOnline = false;
                log("Serveur hors-ligne détecté. Affichage de l'erreur...");
                
                // Essayer de charger la playlist du cache si celle en mémoire est vide
                if (!playlistData.items || playlistData.items.length === 0) {
                    try {
                        const cached = localStorage.getItem('cached_playlist');
                        if (cached) {
                            const parsed = JSON.parse(cached);
                            if (parsed && parsed.items && parsed.items.length > 0) {
                                playlistData = parsed;
                                currentPlaylistId = parsed.id;
                                log("Playlist restaurée depuis le cache local.");
                            }
                        }
                    } catch (e) {
                        console.error("Erreur de restauration cache:", e);
                    }
                }

                // Afficher l'overlay immédiatement
                showOfflineOverlay(false);

                // Lancer le dernier diaporama connu au bout d'une minute
                if (offlineTimer) clearTimeout(offlineTimer);
                offlineTimer = setTimeout(() => {
                    if (playlistData.items && playlistData.items.length > 0) {
                        log("Lancement du dernier diaporama connu...");
                        if (!isPlaying) {
                            isPlaying = true;
                            currentIndex = 0;
                            playNext();
                        }
                        startOfflinePeriodicCycle();
                    } else {
                        log("Aucune playlist en mémoire ou en cache local à lancer.");
                    }
                }, 60000); // 1 minute
            }
        }

        function hideOfflineError() {
            isServerOnline = true;
            if (offlineTimer) {
                clearTimeout(offlineTimer);
                offlineTimer = null;
            }
            stopOfflinePeriodicCycle();
            hideOfflineOverlay();
        }

        function startOfflinePeriodicCycle() {
            stopOfflinePeriodicCycle();
            hideOfflineOverlay(); // Cacher immédiatement l'erreur pour voir le diaporama lancé
            
            offlineCycleInterval = setInterval(() => {
                showOfflineOverlay(true);
                offlineCycleTimeout = setTimeout(() => {
                    hideOfflineOverlay();
                }, 20000); // Affiche le message pendant 20 secondes
            }, 60000); // Répète toutes les minutes (60 secondes)
        }

        function stopOfflinePeriodicCycle() {
            if (offlineCycleInterval) {
                clearInterval(offlineCycleInterval);
                offlineCycleInterval = null;
            }
            if (offlineCycleTimeout) {
                clearTimeout(offlineCycleTimeout);
                offlineCycleTimeout = null;
            }
        }

        // Système de log visuel
        function log(msg, isError = false) {
            console.log(msg);
            const logEl = document.getElementById('debug-log');
            if (logEl) {
                logEl.innerText = msg;
                if (isError) {
                    logEl.style.color = '#e74c3c'; // Rouge pour l'erreur
                    logEl.style.display = 'block';
                } else {
                    const hide = playlistData && playlistData.disableDebugLogs === true;
                    logEl.style.display = hide ? 'none' : 'block';
                    logEl.style.color = '#2ecc71'; // Vert normal
                }
            }
            // Masquer le loader dès qu'une activité de lecture commence ou que la playlist est prête
            if (msg.includes("Démarrage") || msg.includes("suivante") || msg.includes("lecture") || msg.includes("chargée") || msg.includes("Playlist chargée")) {
                document.getElementById('loader').style.display = 'none';
            }
            if (isError && document.getElementById('status-extra')) document.getElementById('status-extra').innerText = msg;
        }

        window.onerror = (m, u, l) => log(`Erreur JS ligne ${l}: ${m}`, true);

        let currentIndex = 0;
        let playlistData = { items: [] };

        function resizePlayerScreen() {
            const screen = document.getElementById('player-screen');
            if (!screen) return;
            const res = playlistData.resolution || '16/9';
            const ratio = res.split('/');
            const wRatio = parseInt(ratio[0]) || 16;
            const hRatio = parseInt(ratio[1]) || 9;
            
            const windowW = window.innerWidth;
            const windowH = window.innerHeight;
            
            let w = windowW;
            let h = windowW * (hRatio / wRatio);
            
            if (h > windowH) {
                h = windowH;
                w = windowH * (wRatio / hRatio);
            }
            
            screen.style.width = w + 'px';
            screen.style.height = h + 'px';
            screen.style.position = 'absolute';
            screen.style.left = '50%';
            screen.style.top = '50%';
            screen.style.transform = 'translate(-50%, -50%)';

            // Mettre à jour l'échelle du template actif si présent et si ce n'est pas video_fullscreen
            const activeTpl = screen.querySelector('.tpl-container');
            if (activeTpl && !activeTpl.querySelector('video')) {
                let designWidth = 1920;
                if (wRatio < hRatio) designWidth = 1080;
                else if (wRatio === hRatio) designWidth = 1080;
                const scale = w / designWidth;
                activeTpl.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizePlayerScreen);

        let isPlaying = false;
        let playTimeout = null;
        let activeClockIntervals = []; // Pour stocker les intervalles des horloges
        let currentPlaylistId = null;
        let activeCustomTemplates = {};

        async function loadCustomTemplates() {
            try {
                let url;
                if (previewId && apiKey) {
                    url = `${serverUrl}/api/player/templates?siteId=${encodeURIComponent(playlistData.siteId || '')}`;
                } else if (playlistData && playlistData.serverOnline !== false) {
                    const targetServerUrl = playlistData.serverUrl || serverUrl;
                    url = `${targetServerUrl}/api/player/templates?siteId=${encodeURIComponent(playlistData.siteId || '')}`;
                } else {
                    url = window.location.protocol === 'file:' ? 'templates.json' : 'templates.json?nocache=' + Date.now();
                }
                
                let res;
                try {
                    res = await fetch(url);
                } catch (e) {
                    if (url.startsWith('http')) {
                        const localUrl = window.location.protocol === 'file:' ? 'templates.json' : 'templates.json?nocache=' + Date.now();
                        res = await fetch(localUrl);
                    } else {
                        throw e;
                    }
                }

                if (res.ok) {
                    activeCustomTemplates = await res.json();
                }
            } catch (err) {
                console.error("Erreur de chargement des styles de modèles:", err);
            }
        }

        // Protection anti-mise en veille au niveau du navigateur (Screen Wake Lock API)
        let wakeLock = null;
        async function requestScreenWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }
        requestScreenWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestScreenWakeLock();
        });
        setInterval(requestScreenWakeLock, 30000);

        const urlParams = new URLSearchParams(window.location.search);
        const serverUrlParam = urlParams.get('serverUrl');
        const previewId = urlParams.get('id');
        const apiKey = urlParams.get('apiKey');
        
        let socket = null;
        // Détection de l'URL du serveur
        let serverUrl = serverUrlParam || (window.location.hostname === "" ? "http://localhost:3000" : window.location.origin);
        if (serverUrl.endsWith('/')) serverUrl = serverUrl.slice(0, -1); // Nettoyage slash final

        function loadSocketIO(baseUrl) {
            if (document.getElementById('socket-io-script')) return;
            const script = document.createElement('script');
            script.id = 'socket-io-script';
            script.src = `${baseUrl}/socket.io/socket.io.js`;
            script.async = true;
            script.onload = () => {
                log("Script Socket.io chargé.");
                if (typeof io === 'undefined') {
                    log("Erreur: io non défini", true);
                    script.remove();
                    return;
                }
                if (playlistData && playlistData.deviceId) initSocketWithId(playlistData.deviceId);
            };
            script.onerror = () => {
                log("Note: Client Socket.io direct non chargé (synchro gérée par sync-engine).", false);
                script.remove();
            };
            document.head.appendChild(script);
        }

        function initSocketWithId(dId) {
            if (socket || typeof io === 'undefined' || !dId) return;
            const finalServerUrl = playlistData.serverUrl || serverUrl;
            const targetKey = playlistData.apiKey || apiKey || 'ma_cle_secrete_123';
            
            socket = io(finalServerUrl, { 
                auth: { token: targetKey, apiKey: targetKey },
                query: { deviceId: dId },
                reconnectionAttempts: Infinity
            }); 
            socket.on('connect', () => {
                log("Socket.io connecté.");
                hideOfflineError();
            });
            socket.on('disconnect', (reason) => {
                log("Socket.io déconnecté: " + reason, false);
                if (!playlistData || !playlistData.items || playlistData.items.length === 0) {
                    showOfflineError();
                }
            });
            socket.on('connect_error', (err) => {
                log("Erreur de connexion Socket.io: " + err.message, false);
                if (!playlistData || !playlistData.items || playlistData.items.length === 0) {
                    showOfflineError();
                }
            });
            setupSocketListeners();
        };

        async function refreshPlaylist() {
            // log("Vérification de la playlist..."); // Trop verbeux pour le log écran
            try {
                let newData = null;
                if (previewId && apiKey) {
                    const res = await fetch(`${serverUrl}/api/admin/data`, { headers: { 'X-API-KEY': apiKey } });
                    if (!res.ok) throw new Error(`Erreur Serveur: ${res.status}`);
                    const data = await res.json();
                    newData = data.playlists[previewId];
                } else {
                    const url = window.location.protocol === 'file:' ? 'playlist.json' : 'playlist.json?nocache=' + Date.now();
                    let res;
                    try {
                        res = await fetch(url);
                    } catch (e) {
                        res = { ok: false, status: 0 };
                    }

                    if (!res.ok) {
                        if (res.status === 404 || window.location.protocol === 'file:') {
                            log("En attente de contenu (playlist.json absent)...", false);
                            document.getElementById('loader').innerHTML = "En attente de contenu...<br><small>Veuillez approuver cet écran dans l'administration.</small>";
                            document.getElementById('loader').style.display = 'block';
                            hideOfflineError();
                            return setTimeout(refreshPlaylist, 10000);
                        }
                        throw new Error(`HTTP ${res.status}`);
                    }
                    
                    const textData = await res.text();
                    if (!textData || textData.trim() === "") {
                        log("Fichier playlist vide, synchronisation en cours ?", false);
                        return setTimeout(refreshPlaylist, 2000);
                    }
                    newData = JSON.parse(textData);
                }

                if (newData && newData.items && newData.items.length > 0) {
                    log("Playlist chargée : " + newData.items.length + " éléments.");
                    try {
                        localStorage.setItem('cached_playlist', JSON.stringify(newData));
                    } catch (e) {
                        console.error("Erreur d'écriture dans localStorage:", e);
                    }
                    if (newData.serverOnline === false) {
                        showOfflineError();
                    } else {
                        hideOfflineError();
                    }
                    const isNewPlaylist = newData.id !== currentPlaylistId;
                    const splashUrl = newData.localSplashScreenUrl || newData.splashScreenUrl;
                    
                    // Initialisation du socket uniquement en mode prévisualisation CMS
                    if (previewId && apiKey) {
                        if (typeof io === 'undefined') {
                            loadSocketIO(newData.serverUrl || serverUrl);
                        } else if (newData.deviceId && !socket) {
                            initSocketWithId(newData.deviceId);
                        }
                    }
                    
                    if (isNewPlaylist) {
                        log("Changement de playlist détecté.");
                        playlistData = newData;
                        currentPlaylistId = newData.id;
                        currentIndex = 0;
                        
                        loadCustomTemplates().then(() => {
                            if (splashUrl) {
                                const splashScreenElement = document.getElementById('splash-screen');
                                const authParam = (previewId && apiKey) ? `?apiKey=${apiKey}` : '';
                                const base = splashUrl.startsWith('./') ? '' : serverUrl;
                                splashScreenElement.src = `${base}${splashUrl}${authParam}`;
                                splashScreenElement.style.display = 'block';
                                document.getElementById('loader').style.display = 'none';
                                
                                if (playTimeout) clearTimeout(playTimeout);
                                isPlaying = true;
                                playTimeout = setTimeout(playNext, 3000); 
                            } else {
                                isPlaying = true;
                                playNext();
                            }
                        });
                    } else {
                        // Mise à jour simple des données sans couper la lecture
                        playlistData = newData;
                        log("Données de playlist synchronisées.");
                        loadCustomTemplates().then(() => {
                            if (!isPlaying) {
                                isPlaying = true;
                                currentIndex = 0;
                                playNext();
                            }
                        });
                    }
                    
                    // Afficher les alertes stockées dans le manifest
                    if (playlistData.activeAlerts) {
                        renderAlertsFromManifest(playlistData.activeAlerts);
                    }
                    // Toujours planifier le prochain rafraîchissement (30s en ligne, 15s hors-ligne)
                    setTimeout(refreshPlaylist, isServerOnline ? 30000 : 15000);
                } else {
                    // Si on a des données mais pas d'items, c'est l'état "en attente" ou une playlist vide
                    if (newData && (newData.status === 'waiting_approval' || newData.items?.length === 0)) {
                        log("Afficheur non configuré.");
                        document.getElementById('loader').innerHTML = "En attente d'approbation ou de contenu...<br><small>ID de l'appareil : <b>" + (newData.deviceId || 'Inconnu') + "</b></small>";
                        document.getElementById('loader').style.display = 'block';
                        hideOfflineError();
                    } else {
                        log("Playlist vide ou invalide.", true);
                    }
                    setTimeout(refreshPlaylist, 10000);
                }
            } catch (e) { 
                log("Attente de synchronisation...", false);
                if (!playlistData || !playlistData.items || playlistData.items.length === 0) {
                    showOfflineError();
                }
                setTimeout(refreshPlaylist, 5000); 
            }
        }

        function playNext() {
            // On nettoie le timeout précédent pour éviter les boucles multiples
            if (playTimeout) clearTimeout(playTimeout);
            // Sécurité : si la playlist est vide ou l'index invalide (changement de playlist)
            if (!playlistData.items || playlistData.items.length === 0) {
                isPlaying = false;
                return;
            }
            if (currentIndex >= playlistData.items.length) currentIndex = 0;

            resizePlayerScreen();

            // Cacher le splashscreen si visible
            const splashScreenElement = document.getElementById('splash-screen');
            if (splashScreenElement) splashScreenElement.style.display = 'none';

            // Sécurité : si l'index est hors limites (playlist raccourcie), on revient au début
            if (!playlistData.items[currentIndex]) {
                currentIndex = 0;
            }

            const page = playlistData.items[currentIndex];
            if (!page) {
                log("Erreur: page indéfinie à l'index " + currentIndex, true);
                isPlaying = false;
                return;
            }
            const globalBgElement = document.getElementById('global-background');
            const pageZonesContainer = document.getElementById('current-page-zones');

            // Enregistrement des statistiques (hors mode prévisualisation)
            if (!previewId && !playlistData.disableClientLogs) {
                // Déterminer un nom de média/page lisible et détaillé (avec décomposition des zones pour les pages composites)
                let itemUrl = page.name || page.title || page.data?.name || page.data?.title;
                if (!itemUrl) {
                    if (page.url) {
                        itemUrl = page.url;
                    } else if (page.data && (page.data.videoUrl || page.data.imageUrl)) {
                        itemUrl = page.data.videoUrl || page.data.imageUrl;
                    } else {
                        const zones = page.zones || page.data?.zones || [];
                        if (zones.length > 0) {
                            const zoneDescs = zones.map(z => {
                                const rawPath = z.mediaUrl || z.url || z.src || '';
                                const cleanName = rawPath ? rawPath.split('/').pop().split('?')[0].replace(/^(yt|img|pptx|zip|pdf|media|file)_\d+_/i, '') : '';
                                const label = z.title || z.name || cleanName || z.type || 'Zone';
                                const typeTag = z.type ? `[${z.type}]` : '';
                                return `${typeTag} ${label}`.trim();
                            }).filter(Boolean);
                            itemUrl = `Page composite (${zones.length} zones: ${zoneDescs.slice(0, 3).join(' + ')})`;
                        } else {
                            itemUrl = 'Page composite (Multi-zones)';
                        }
                    }
                } else {
                    const zones = page.zones || page.data?.zones || [];
                    if (zones.length > 0) {
                        itemUrl = `Composite "${itemUrl}" (${zones.length} zones)`;
                    }
                }
                
                // On utilise les infos provenant du manifest local (playlist.json)
                const targetServerUrl = playlistData.serverUrl || serverUrl;
                const targetApiKey = playlistData.apiKey || apiKey || 'ma_cle_secrete_123';

                log(`Envoi stats vers ${targetServerUrl}...`);

                fetch(targetServerUrl + '/api/player/log', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-API-KEY': targetApiKey
                    },
                    body: JSON.stringify({
                        deviceId: playlistData.deviceId || 'unknown',
                        playlistId: playlistData.id || 'local',
                        itemUrl: itemUrl,
                        duration: page.duration
                    })
                })
                .then(res => { 
                    if(!res.ok) throw new Error(`HTTP ${res.status}`);
                    // console.log("Stats envoyées avec succès");
                })
                .catch(err => {
                    // Log silencieux dans la console du navigateur en cas d'erreur de statistiques hors-ligne
                    console.warn("Erreur stats (hors-ligne ?) :", err.message);
                });
            }

            // Nettoyer les intervalles d'horloge de la page précédente
            activeClockIntervals.forEach(clearInterval);
            activeClockIntervals = [];


            // Appliquer la couleur de fond (Page > Globale)
            const bgColor = page.backgroundColor || playlistData.backgroundColor || 'black';
            document.getElementById('player-screen').style.backgroundColor = bgColor;

            // Définir le fond (Page > Globale)
            const pageBg = page.localBackgroundUrl || page.backgroundUrl;
            const bgGlobal = pageBg || playlistData.localBackgroundUrl || playlistData.backgroundUrl;
            if (bgGlobal) {
                const auth = (previewId && apiKey) ? `?apiKey=${apiKey}` : '';
                globalBgElement.src = bgGlobal.startsWith('/media') ? `${bgGlobal}${auth}` : bgGlobal;
                    globalBgElement.style.display = 'block';
            } else {
                globalBgElement.style.display = 'none';
            }

            // Effacer les zones précédentes
            pageZonesContainer.innerHTML = '';

            // Rendu des modèles
            if (page.template) {
                const tpl = document.createElement('div');
                tpl.className = 'tpl-container anim-fade-in';
                const targetServerUrl = playlistData.serverUrl || serverUrl;
                
                const res = playlistData.resolution || '16/9';
                const ratio = res.split('/');
                const wRatio = parseInt(ratio[0]) || 16;
                const hRatio = parseInt(ratio[1]) || 9;
                
                let designWidth = 1920;
                let designHeight = 1080;
                if (wRatio < hRatio) {
                    designWidth = 1080;
                    designHeight = 1920;
                } else if (wRatio === hRatio) {
                    designWidth = 1080;
                    designHeight = 1080;
                }
                
                const playerScreen = document.getElementById('player-screen');
                const playerWidth = playerScreen.clientWidth || window.innerWidth;
                const playerHeight = playerScreen.clientHeight || window.innerHeight;

                const overlay = document.getElementById('alert-overlay');
                let alertsHeight = 0;
                if (overlay && overlay.children.length > 0) {
                    Array.from(overlay.children).forEach(child => {
                        alertsHeight += child.offsetHeight || 0;
                    });
                    if (alertsHeight === 0) {
                        alertsHeight = overlay.children.length * (window.innerWidth * 0.025 + 30);
                    }
                }
                const availableHeight = playerHeight - alertsHeight;

                const scaleX = playerWidth / designWidth;
                const scaleY = availableHeight / designHeight;
                const scaleRatio = Math.min(scaleX, scaleY);
                
                if (page.template !== 'video_fullscreen') {
                    tpl.style.width = designWidth + 'px';
                    tpl.style.height = designHeight + 'px';
                    tpl.style.transform = `scale(${scaleRatio})`;
                    tpl.style.transformOrigin = 'top left';
                    tpl.style.position = 'absolute';
                    const scaledWidth = designWidth * scaleRatio;
                    const leftOffset = (playerWidth - scaledWidth) / 2;
                    tpl.style.left = leftOffset + 'px';
                    tpl.style.top = '0';
                    tpl.style.boxSizing = 'border-box';
                }

                // Appliquer les styles généraux du template personnalisé
                const customTpl = activeCustomTemplates[page.template];
                if (customTpl) {
                    if (customTpl.backgroundColor) tpl.style.backgroundColor = customTpl.backgroundColor;
                    if (customTpl.backgroundUrl) {
                        const bgUrl = customTpl.backgroundUrl.startsWith('./') ? customTpl.backgroundUrl : `${targetServerUrl}${customTpl.backgroundUrl}`;
                        const auth = (previewId && apiKey) ? `?apiKey=${apiKey}` : '';
                        tpl.style.backgroundImage = `url("${bgUrl}${auth}")`;
                        tpl.style.backgroundSize = 'cover';
                        tpl.style.backgroundPosition = 'center';
                    } else {
                        tpl.style.backgroundImage = 'none';
                    }
                    if (customTpl.fontFamily) {
                        tpl.style.fontFamily = customTpl.fontFamily.startsWith('font-') ? `"${customTpl.fontFamily}", sans-serif` : customTpl.fontFamily;
                    }
                    if (customTpl.borderStyle && customTpl.borderStyle !== 'none') {
                        tpl.style.border = `${customTpl.borderWidth || 0}px ${customTpl.borderStyle} ${customTpl.borderColor || 'transparent'}`;
                    } else {
                        tpl.style.border = 'none';
                    }
                    if (customTpl.borderRadius) tpl.style.borderRadius = `${customTpl.borderRadius}px`;
                    else tpl.style.borderRadius = '0';
                } else {
                    tpl.style.backgroundColor = 'transparent';
                    tpl.style.backgroundImage = 'none';
                    tpl.style.fontFamily = 'sans-serif';
                    tpl.style.border = 'none';
                    tpl.style.borderRadius = '0';
                }

                // Surcharger avec le CSS personnalisé
                const oldStyle = document.getElementById('custom-player-template-styles');
                if (oldStyle) oldStyle.remove();
                if (customTpl && customTpl.customCss) {
                    const style = document.createElement('style');
                    style.id = 'custom-player-template-styles';
                    style.textContent = customTpl.customCss.replace(/([^\r\n,{}]+)(,(?=[^}]*{)|(?=[^{]*{))/g, '.tpl-container $1$2');
                    document.head.appendChild(style);
                }

                if (page.template === 'canteen') {
                    const dayNames = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
                    const today = dayNames[new Date().getDay()];
                    const isLive = page.data && page.data.useLiveMenu !== false;
                    const dId = (playlistData && playlistData.deviceId) ? playlistData.deviceId : '';
                    const sId = (playlistData && playlistData.siteId) ? playlistData.siteId : '';

                    const renderCanteen = (weekData) => {
                        const menu = (weekData && weekData[today]) ? weekData[today] : { starter: 'Non renseignée', main: 'Non renseigné', dessert: 'Non renseigné' };
                        const title = page.data.title || 'MENU DU JOUR';
                        
                        if (customTpl && customTpl.customHtml) {
                            let html = customTpl.customHtml;
                            html = html.replace(/{{title}}/g, title)
                                       .replace(/{{day}}/g, today)
                                       .replace(/{{starter}}/g, menu.starter || 'Non renseignée')
                                       .replace(/{{main}}/g, menu.main || 'Non renseigné')
                                       .replace(/{{dessert}}/g, menu.dessert || 'Non renseigné');
                            tpl.innerHTML = html;
                        } else {
                            const titleColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#3498db';
                            const titleSize = (customTpl && customTpl.titleFontSize) ? `${parseInt(customTpl.titleFontSize)}px` : '96px';
                            const textColor = (customTpl && customTpl.textColor) ? customTpl.textColor : '#ffffff';
                            const textSize = (customTpl && customTpl.textFontSize) ? `${parseInt(customTpl.textFontSize)}px` : '58px';
                            const labelColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#3498db';
                            const labelSize = (customTpl && customTpl.textFontSize) ? `${parseInt(customTpl.textFontSize) * 0.8}px` : '38px';

                            tpl.innerHTML = `
                                <div class="tpl-header" style="color:${titleColor}; font-size:${titleSize}; border-bottom-color:${titleColor};">${title} (${today})</div>
                                <div class="tpl-content">
                                    <div class="tpl-row" style="color:${textColor};">
                                        <div class="tpl-label" style="color:${labelColor}; font-size:${labelSize};">ENTRÉE</div>
                                        <div class="tpl-value" style="font-size:${textSize};">${menu.starter || 'Non renseignée'}</div>
                                    </div>
                                    <div class="tpl-row" style="color:${textColor};">
                                        <div class="tpl-label" style="color:${labelColor}; font-size:${labelSize};">PLAT</div>
                                        <div class="tpl-value" style="font-size:${textSize};">${menu.main || 'Non renseigné'}</div>
                                    </div>
                                    <div class="tpl-row" style="color:${textColor};">
                                        <div class="tpl-label" style="color:${labelColor}; font-size:${labelSize};">DESSERT</div>
                                        <div class="tpl-value" style="font-size:${textSize};">${menu.dessert || 'Non renseigné'}</div>
                                    </div>
                                </div>`;
                        }
                    };
                    
                    if (isLive) {
                        tpl.innerHTML = `<div class="tpl-header">Chargement du menu...</div>`;
                        fetch(`${targetServerUrl}/api/player/canteen/current?deviceId=${encodeURIComponent(dId)}&siteId=${encodeURIComponent(sId)}`)
                            .then(r => {
                                if (!r.ok) throw new Error("HTTP " + r.status);
                                return r.json();
                            })
                            .then(weekData => {
                                if (weekData && Object.keys(weekData).length > 0) {
                                    try { localStorage.setItem('cached_canteen_menu', JSON.stringify(weekData)); } catch(e){}
                                }
                                renderCanteen(weekData);
                            })
                            .catch(async () => {
                                try {
                                    const rLocal = await fetch('canteen.json?nocache=' + Date.now());
                                    if (rLocal.ok) {
                                        const localWeekData = await rLocal.json();
                                        if (localWeekData && Object.keys(localWeekData).length > 0) return renderCanteen(localWeekData);
                                    }
                                } catch(e) {}
                                try {
                                    const cachedStr = localStorage.getItem('cached_canteen_menu');
                                    if (cachedStr) return renderCanteen(JSON.parse(cachedStr));
                                } catch(e) {}
                                renderCanteen({});
                            });
                    } else {
                        const title = page.data.title || 'MENU CANTINE';
                        if (customTpl && customTpl.customHtml) {
                            let html = customTpl.customHtml;
                            html = html.replace(/{{title}}/g, title)
                                       .replace(/{{day}}/g, 'Menu du jour')
                                       .replace(/{{starter}}/g, page.data.starter || 'Non renseignée')
                                       .replace(/{{main}}/g, page.data.main || 'Non renseigné')
                                       .replace(/{{dessert}}/g, page.data.dessert || 'Non renseigné');
                            tpl.innerHTML = html;
                        } else {
                            const titleColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#3498db';
                            const titleSize = (customTpl && customTpl.titleFontSize) ? `${parseInt(customTpl.titleFontSize)}px` : '96px';
                            const textColor = (customTpl && customTpl.textColor) ? customTpl.textColor : '#ffffff';
                            const textSize = (customTpl && customTpl.textFontSize) ? `${parseInt(customTpl.textFontSize)}px` : '58px';
                            const labelColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#3498db';
                            const labelSize = (customTpl && customTpl.textFontSize) ? `${parseInt(customTpl.textFontSize) * 0.8}px` : '38px';

                            tpl.innerHTML = `
                                <div class="tpl-header" style="color:${titleColor}; font-size:${titleSize}; border-bottom-color:${titleColor};">${title}</div>
                                <div class="tpl-content">
                                    <div class="tpl-row" style="color:${textColor};">
                                        <div class="tpl-label" style="color:${labelColor}; font-size:${labelSize};">ENTRÉE</div>
                                        <div class="tpl-value" style="font-size:${textSize};">${page.data.starter || 'Non renseignée'}</div>
                                    </div>
                                    <div class="tpl-row" style="color:${textColor};">
                                        <div class="tpl-label" style="color:${labelColor}; font-size:${labelSize};">PLAT</div>
                                        <div class="tpl-value" style="font-size:${textSize};">${page.data.main || 'Non renseigné'}</div>
                                    </div>
                                    <div class="tpl-row" style="color:${textColor};">
                                        <div class="tpl-label" style="color:${labelColor}; font-size:${labelSize};">DESSERT</div>
                                        <div class="tpl-value" style="font-size:${textSize};">${page.data.dessert || 'Non renseigné'}</div>
                                    </div>
                                </div>`;
                        }
                    }
                } else if (page.template === 'meeting') {
                    const isLive = page.data && page.data.useLiveMeeting !== false;
                    const dId = (playlistData && playlistData.deviceId) ? playlistData.deviceId : '';
                    const sId = (playlistData && playlistData.siteId) ? playlistData.siteId : '';
                    const roomName = page.data.room || 'Salle de Réunion';

                    const renderMeetings = (data) => {
                        const allMeetings = (data && data.meetings) ? data.meetings : [];
                        const now = new Date();

                        const resolveRoomPhoto = (photoPath) => {
                            if (!photoPath) return '';
                            const isLocal = window.location.protocol === 'file:' || 
                                            window.location.hostname === 'localhost' || 
                                            window.location.hostname === '127.0.0.1';
                            if (isLocal) {
                                if (window.location.protocol === 'file:') {
                                    if (photoPath.startsWith('/img/rooms/')) {
                                        return 'img/rooms/' + photoPath.substring('/img/rooms/'.length);
                                    }
                                    if (photoPath.startsWith('/')) {
                                        return photoPath.substring(1);
                                    }
                                }
                                return photoPath;
                            } else {
                                if (photoPath.startsWith('/')) {
                                    return `${targetServerUrl}${photoPath}`;
                                }
                                return photoPath;
                            }
                        };

                        console.log("[Player Meetings] Salles chargées :", data.rooms);
                        console.log("[Player Meetings] Recherche de la salle :", roomName);

                        const showAllRooms = !roomName || roomName === 'Toutes les Salles' || roomName === 'Toutes les salles';
                        const targetRoom = showAllRooms 
                            ? { name: 'Toutes les Salles', id: 'Toutes les Salles' } 
                            : ((data.rooms || []).find(r => r.name === roomName || r.id === roomName) || { name: roomName, id: roomName });

                        // Filtrer pour n'avoir que les réunions de cette salle
                        const roomMeetings = showAllRooms 
                            ? allMeetings 
                            : allMeetings.filter(m => m.roomId === targetRoom.id || m.roomId === targetRoom.name);

                        // Filtrer les réunions de la salle dont l'heure de fin est dépassée
                        const activeMeetings = roomMeetings.filter(m => {
                            if (!m.endTime) return true;
                            let endIso = m.endTime;
                            if (!endIso.includes('T')) {
                                const todayStr = now.toISOString().split('T')[0];
                                endIso = `${todayStr}T${m.endTime}`;
                            }
                            const endDate = new Date(endIso);
                            return isNaN(endDate.getTime()) || endDate > now;
                        });

                        if (activeMeetings.length === 0) {
                            const room = targetRoom;
                            console.log("[Player Meetings] Salle trouvée (no meeting) :", room);
                            const resolvedPhoto = resolveRoomPhoto(room.photo);
                            console.log("[Player Meetings] Photo résolue (no meeting) :", resolvedPhoto);
                            if (customTpl && customTpl.customHtml) {
                                let html = customTpl.customHtml;
                                html = html.replace(/{{room}}/g, room.name)
                                           .replace(/{{subject}}/g, 'Aucune réunion à venir')
                                           .replace(/{{status}}/g, 'Disponible')
                                           .replace(/{{startTime}}/g, '')
                                           .replace(/{{endTime}}/g, '')
                                           .replace(/{{photo}}/g, resolvedPhoto);
                                tpl.innerHTML = html;
                            } else {
                                const titleColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#ffffff';
                                const titleSize = (customTpl && customTpl.titleFontSize) ? `${parseInt(customTpl.titleFontSize) * scaleRatio}px` : '8vw';
                                if (resolvedPhoto) {
                                    tpl.innerHTML = `
                                        <div style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; gap: 40px; box-sizing: border-box; padding: 20px;">
                                            <div style="flex: 1.2; height: 100%; display: flex; align-items: center; justify-content: center;">
                                                <img src="${resolvedPhoto}" style="width: 100%; max-height: 80vh; object-fit: cover; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
                                            </div>
                                            <div style="flex: 1; text-align: left; padding-left: 20px;">
                                                <div class="tpl-meeting-room" style="color:${titleColor}; font-size:${titleSize}; margin-bottom: 20px;">${room.name}</div>
                                                <div style="font-size: 3vw; color: #2ecc71; margin-top: 3vh;">🟢 Disponible</div>
                                                <div style="font-size: 2vw; color: #bdc3c7; margin-top: 2vh;">Aucune réunion à venir</div>
                                            </div>
                                        </div>`;
                                } else {
                                    tpl.innerHTML = `
                                        <div class="tpl-meeting-room" style="color:${titleColor}; font-size:${titleSize};">${room.name}</div>
                                        <div style="font-size: 3vw; color: #2ecc71; margin-top: 3vh;">🟢 Aucune réunion à venir</div>`;
                                }
                            }
                        } else {
                            const firstM = activeMeetings[0];
                            const room = showAllRooms 
                                ? ((data.rooms || []).find(r => r.id === firstM.roomId || r.name === firstM.roomId) || { name: firstM.roomId || 'Salle de Réunion' })
                                : targetRoom;
                            console.log("[Player Meetings] Salle trouvée (active meeting) :", room);
                            
                            let startIso = firstM.startTime;
                            let endIso = firstM.endTime;
                            if (startIso && !startIso.includes('T')) {
                                const todayStr = now.toISOString().split('T')[0];
                                startIso = `${todayStr}T${startIso}`;
                            }
                            if (endIso && !endIso.includes('T')) {
                                const todayStr = now.toISOString().split('T')[0];
                                endIso = `${todayStr}T${endIso}`;
                            }

                            const startDate = new Date(startIso);
                            const endDate = new Date(endIso);
                            const isInProgress = (now >= startDate && now < endDate);

                            const startDisplay = firstM.startTime ? (firstM.startTime.includes('T') ? firstM.startTime.substring(11, 16) : firstM.startTime) : '';
                            const endDisplay = firstM.endTime ? (firstM.endTime.includes('T') ? firstM.endTime.substring(11, 16) : firstM.endTime) : '';

                            const status = isInProgress ? 'Occupée' : 'Prochaine réunion';
                            const badgeAvailable = (customTpl && customTpl.badgeBgAvailable) ? customTpl.badgeBgAvailable : '#3498db';
                            const badgeBusy = (customTpl && customTpl.badgeBgBusy) ? customTpl.badgeBgBusy : '#e74c3c';
                            const bgBadge = isInProgress ? badgeBusy : badgeAvailable;

                            const resolvedPhoto = resolveRoomPhoto(room.photo);
                            console.log("[Player Meetings] Photo résolue (active meeting) :", resolvedPhoto);
                            if (customTpl && customTpl.customHtml) {
                                let html = customTpl.customHtml;
                                html = html.replace(/{{room}}/g, room.name)
                                           .replace(/{{subject}}/g, firstM.title || 'Réunion')
                                           .replace(/{{status}}/g, status)
                                           .replace(/{{startTime}}/g, startDisplay)
                                           .replace(/{{endTime}}/g, endDisplay)
                                           .replace(/{{photo}}/g, resolvedPhoto);
                                tpl.innerHTML = html;
                            } else {
                                const titleColor = (customTpl && customTpl.titleColor) ? customTpl.titleColor : '#ffffff';
                                const titleSize = (customTpl && customTpl.titleFontSize) ? `${parseInt(customTpl.titleFontSize)}px` : '154px';
